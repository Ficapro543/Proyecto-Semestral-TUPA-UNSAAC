<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Trámites | TUPA UNSAAC Admin</title>
  <meta name="description" content="Panel de gestión y configuración de los procedimientos del catálogo TUPA UNSAAC." />
  <link rel="stylesheet" href="../shared/design-system.css" />
</head>
<body class="app-layout">

<div id="sidebar-mount"></div>
<div class="main-content">
  <div id="topbar-mount"></div>
  <div class="page-content">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta de navegación"></nav>

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-md);margin-bottom:var(--sp-xl)">
      <div>
        <h1 class="text-display-md" style="color:var(--clr-primary)">Gestión de Procedimientos</h1>
        <p class="text-body-md" style="color:var(--clr-secondary);margin-top:4px">Administra el catálogo de 103 procedimientos del TUPA</p>
      </div>
      <div style="display:flex;gap:var(--sp-sm)">
        <button class="btn btn-outline" onclick="showToast({message:'Exportando catálogo...',type:'info'})">
          <span class="material-symbols-outlined">download</span> Exportar
        </button>
        <button class="btn btn-primary" onclick="showModal('modal-new-proc')">
          <span class="material-symbols-outlined">add</span> Nuevo procedimiento
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--sp-md);margin-bottom:var(--sp-xl)">
      <div class="card" style="text-align:center;padding:var(--sp-lg)">
        <div style="font-family:'Hanken Grotesk',sans-serif;font-size:36px;font-weight:800;color:var(--clr-primary)">103</div>
        <div style="font-size:13px;color:var(--clr-secondary)">Procedimientos totales</div>
      </div>
      <div class="card" style="text-align:center;padding:var(--sp-lg)">
        <div style="font-family:'Hanken Grotesk',sans-serif;font-size:36px;font-weight:800;color:#065f46">22</div>
        <div style="font-size:13px;color:var(--clr-secondary)">Gratuitos</div>
      </div>
      <div class="card" style="text-align:center;padding:var(--sp-lg)">
        <div style="font-family:'Hanken Grotesk',sans-serif;font-size:36px;font-weight:800;color:#92400e">81</div>
        <div style="font-size:13px;color:var(--clr-secondary)">Con costo</div>
      </div>
      <div class="card" style="text-align:center;padding:var(--sp-lg)">
        <div style="font-family:'Hanken Grotesk',sans-serif;font-size:36px;font-weight:800;color:var(--clr-primary)">6</div>
        <div style="font-size:13px;color:var(--clr-secondary)">Categorías</div>
      </div>
    </div>

    <!-- Table -->
    <div class="card animate-on-load">
      <div class="card-header" style="flex-wrap:wrap;gap:var(--sp-md)">
        <span class="card-header-title">Catálogo de procedimientos</span>
        <div style="display:flex;gap:var(--sp-sm);flex-wrap:wrap;margin-left:auto">
          <div style="position:relative">
            <span class="material-symbols-outlined" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--clr-outline)">search</span>
            <input id="proc-admin-search" type="text" placeholder="Buscar procedimiento..."
                   style="height:36px;padding:0 var(--sp-md) 0 34px;border:1px solid var(--clr-outline-variant);border-radius:var(--radius-lg);font-size:13px;outline:none" />
          </div>
          <select class="form-select" style="height:36px;font-size:13px;width:140px">
            <option>Todas las categorías</option>
            <option>Académico</option>
            <option>Administrativo</option>
            <option>Bienestar</option>
          </select>
        </div>
      </div>
      <!-- Header row -->
      <div style="display:grid;grid-template-columns:60px 1fr 120px 100px 100px 80px;gap:var(--sp-md);padding:var(--sp-md) var(--sp-lg);background:var(--clr-surface-container-low);font-size:11px;font-weight:700;color:var(--clr-secondary);text-transform:uppercase;letter-spacing:0.06em">
        <div>Código</div><div>Procedimiento</div><div>Categoría</div><div>Costo</div><div>Plazo</div><div>Acciones</div>
      </div>
      <div id="proc-admin-list"></div>
    </div>
  </div>
  <div id="footer-mount"></div>
</div>

<!-- New procedure modal -->
<div class="modal-overlay" id="modal-new-proc" onclick="if(event.target===this)closeModal('modal-new-proc')">
  <div class="modal" role="dialog" aria-labelledby="modal-new-proc-title">
    <div class="modal-header">
      <div class="modal-title" id="modal-new-proc-title">Nuevo Procedimiento</div>
      <button class="modal-close" onclick="closeModal('modal-new-proc')"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-md);margin-bottom:var(--sp-md)">
        <div class="form-group">
          <label class="form-label required" for="np-code">Código TUPA</label>
          <input class="form-input" id="np-code" placeholder="Ej. P104" />
        </div>
        <div class="form-group">
          <label class="form-label required" for="np-cat">Categoría</label>
          <select class="form-select w-full" id="np-cat">
            <option>Académico</option><option>Administrativo</option><option>Bienestar</option><option>Investigación</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:var(--sp-md)">
        <label class="form-label required" for="np-name">Nombre del procedimiento</label>
        <input class="form-input" id="np-name" placeholder="Nombre oficial del procedimiento" />
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-md);margin-bottom:var(--sp-md)">
        <div class="form-group">
          <label class="form-label required" for="np-cost">Costo (S/.)</label>
          <input class="form-input" id="np-cost" type="number" placeholder="0.00" />
        </div>
        <div class="form-group">
          <label class="form-label required" for="np-days">Plazo (días hábiles)</label>
          <input class="form-input" id="np-days" type="number" placeholder="Ej. 15" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="np-desc">Descripción</label>
        <textarea class="form-textarea" id="np-desc" rows="3" placeholder="Descripción breve del procedimiento..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-new-proc')">Cancelar</button>
      <button class="btn btn-primary" onclick="showToast({message:'Procedimiento creado correctamente',type:'success'});closeModal('modal-new-proc')">
        <span class="material-symbols-outlined">save</span>
        Crear procedimiento
      </button>
    </div>
  </div>
</div>

<script src="../shared/navigation.js"></script>
<script src="../shared/components.js"></script>
<script>
  document.getElementById('sidebar-mount').outerHTML = AdminSidebar({ activeRoute: 'admin.procedimientos' });
  document.getElementById('topbar-mount').outerHTML  = AdminTopbar({ title: 'Gestión de Procedimientos' });
  document.getElementById('footer-mount').outerHTML  = SharedFooter();

  const procedures = [
    { code:'P001', name:'Diploma de Bachiller', cat:'Académico', cost:'S/. 120.00', days:'15 días', active:true },
    { code:'P002', name:'Certificado de Matrícula', cat:'Académico', cost:'Gratuito', days:'2 días', active:true },
    { code:'P003', name:'Constancia de Egresado', cat:'Académico', cost:'S/. 30.00', days:'3 días', active:true },
    { code:'P004', name:'Récord Académico', cat:'Académico', cost:'S/. 15.00', days:'1 día', active:true },
    { code:'P005', name:'Título Profesional', cat:'Académico', cost:'S/. 250.00', days:'30 días', active:true },
    { code:'P006', name:'Homologación de Notas', cat:'Académico', cost:'S/. 45.00', days:'7 días', active:true },
    { code:'P007', name:'Traslado Externo', cat:'Administrativo', cost:'S/. 180.00', days:'20 días', active:true },
    { code:'P008', name:'Cambio de Especialidad', cat:'Administrativo', cost:'S/. 60.00', days:'10 días', active:false },
    { code:'P009', name:'Duplicado de Carné Universitario', cat:'Administrativo', cost:'S/. 25.00', days:'3 días', active:true },
    { code:'P010', name:'Beca Comedor Universitario', cat:'Bienestar', cost:'Gratuito', days:'5 días', active:true },
  ];

  document.getElementById('proc-admin-list').innerHTML = procedures.map(p => `
    <div class="animate-on-load" style="display:grid;grid-template-columns:60px 1fr 120px 100px 100px 80px;gap:var(--sp-md);padding:var(--sp-md) var(--sp-lg);border-bottom:1px solid var(--clr-outline-variant);align-items:center;cursor:pointer;transition:background 0.15s" onmouseover="this.style.background='var(--clr-surface-container-low)'" onmouseout="this.style.background=''">
      <div class="text-mono-sm" style="color:var(--clr-primary)">${p.code}</div>
      <div>
        <div style="font-size:14px;font-weight:600;color:var(--clr-on-surface)">${p.name}</div>
        ${!p.active ? '<span class="badge badge-neutral" style="font-size:10px">Inactivo</span>' : ''}
      </div>
      <div><span class="badge badge-primary" style="font-size:11px">${p.cat}</span></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--clr-primary)">${p.cost}</div>
      <div style="font-size:13px;color:var(--clr-secondary)">${p.days}</div>
      <div style="display:flex;gap:4px">
        <button class="btn btn-ghost btn-sm" onclick="showToast({message:'Editando ${p.name}',type:'info'})">
          <span class="material-symbols-outlined icon-sm">edit</span>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="showToast({message:'${p.active ? 'Desactivado: ' : 'Activado: '}${p.name}',type:'info'})">
          <span class="material-symbols-outlined icon-sm">${p.active ? 'toggle_on' : 'toggle_off'}</span>
        </button>
      </div>
    </div>
  `).join('');

  initPage({ route: 'admin.procedimientos', pageTitle: 'Gestión de Procedimientos' });
  initSearch('#proc-admin-search', '.animate-on-load');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Solicitudes | TUPA UNSAAC</title>
  <meta name="description" content="Registro de solicitudes y expedientes administrativos del estudiante." />
  <link rel="stylesheet" href="../shared/design-system.css" />
</head>
<body class="app-layout">

<div id="sidebar-mount"></div>
<div class="main-content">
  <div id="topbar-mount"></div>
  <div class="page-content">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta de navegación"></nav>

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-md);margin-bottom:var(--sp-xl)">
      <div>
        <h1 class="text-display-md" style="color:var(--clr-primary)">Mis Solicitudes</h1>
        <p class="text-body-md" style="color:var(--clr-secondary);margin-top:4px">Borradores y solicitudes en curso que aún no han sido enviadas</p>
      </div>
      <button class="btn btn-primary" onclick="navigate('tramite.paso1')">
        <span class="material-symbols-outlined">add</span>
        Nueva Solicitud
      </button>
    </div>

    <!-- Tab selector -->
    <div class="tabs" id="req-tabs" style="margin-bottom:var(--sp-xl)">
      <div class="tab-item" data-tab="tab-borrador">Borradores (2)</div>
      <div class="tab-item" data-tab="tab-enviadas">Enviadas (5)</div>
      <div class="tab-item" data-tab="tab-completadas">Completadas (12)</div>
    </div>

    <!-- Borrador cards -->
    <div class="tab-content" id="tab-borrador">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--sp-lg)">
        <div class="card animate-on-load" style="border-left:4px solid var(--clr-secondary)">
          <div class="card-body">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--sp-md)">
              <div>
                <div style="font-family:'Hanken Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--clr-primary)">Diploma de Bachiller</div>
                <span class="badge badge-neutral" style="margin-top:4px">Borrador</span>
              </div>
              <div style="width:48px;height:48px;background:var(--clr-surface-container);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center">
                <span class="material-symbols-outlined icon-filled" style="font-size:24px;color:var(--clr-secondary)">draft</span>
              </div>
            </div>
            <div style="font-size:13px;color:var(--clr-secondary);margin-bottom:var(--sp-md)">
              Guardado: hace 3 días · Completado al 60%
            </div>
            <div class="progress" style="height:6px;margin-bottom:var(--sp-lg)">
              <div class="progress-bar" style="width:60%"></div>
            </div>
            <div style="display:flex;gap:var(--sp-sm)">
              <button class="btn btn-primary flex-1" onclick="navigate('tramite.paso3')">
                <span class="material-symbols-outlined">edit</span>
                Continuar
              </button>
              <button class="btn btn-ghost" onclick="showToast({message:'Borrador eliminado',type:'warning'})">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
          </div>
        </div>
        <div class="card animate-on-load stagger-1" style="border-left:4px solid var(--clr-secondary)">
          <div class="card-body">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--sp-md)">
              <div>
                <div style="font-family:'Hanken Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--clr-primary)">Traslado Externo</div>
                <span class="badge badge-neutral" style="margin-top:4px">Borrador</span>
              </div>
              <div style="width:48px;height:48px;background:var(--clr-surface-container);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center">
                <span class="material-symbols-outlined icon-filled" style="font-size:24px;color:var(--clr-secondary)">draft</span>
              </div>
            </div>
            <div style="font-size:13px;color:var(--clr-secondary);margin-bottom:var(--sp-md)">
              Guardado: hace 1 semana · Completado al 20%
            </div>
            <div class="progress" style="height:6px;margin-bottom:var(--sp-lg)">
              <div class="progress-bar" style="width:20%"></div>
            </div>
            <div style="display:flex;gap:var(--sp-sm)">
              <button class="btn btn-primary flex-1" onclick="navigate('tramite.paso1')">
                <span class="material-symbols-outlined">edit</span>
                Continuar
              </button>
              <button class="btn btn-ghost" onclick="showToast({message:'Borrador eliminado',type:'warning'})">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Enviadas -->
    <div class="tab-content" id="tab-enviadas">
      <div class="card animate-on-load">
        <div id="enviadas-list"></div>
      </div>
    </div>

    <!-- Completadas -->
    <div class="tab-content" id="tab-completadas">
      <div class="card animate-on-load">
        <div id="completadas-list"></div>
      </div>
    </div>
  </div>
  <div id="footer-mount"></div>
</div>

<script src="../shared/navigation.js"></script>
<script src="../shared/components.js"></script>
<script>
  document.getElementById('sidebar-mount').outerHTML = StudentSidebar({ activeRoute: 'estudiante.solicitudes', notifCount: 2 });
  document.getElementById('topbar-mount').outerHTML  = StudentTopbar({ title: 'Mis Solicitudes' });
  document.getElementById('footer-mount').outerHTML  = SharedFooter();

  const rowStyle = 'display:grid;grid-template-columns:1fr 140px 120px;gap:var(--sp-md);padding:var(--sp-md) var(--sp-lg);border-bottom:1px solid var(--clr-outline-variant);align-items:center;cursor:pointer;transition:background 0.15s';

  const enviadas = [
    { exp:'EXP-2024-8902', title:'Diploma de Bachiller', status:'En Revisión', sc:'badge-in-review', date:'12 Oct 2024' },
    { exp:'EXP-2024-1102', title:'Certificado de Matrícula', status:'Verificando pago', sc:'badge-warning', date:'15 Sep 2024' },
    { exp:'EXP-2024-0891', title:'Récord Académico', status:'Pendiente', sc:'badge-neutral', date:'20 Ago 2024' },
    { exp:'EXP-2024-0442', title:'Constancia de Egresado', status:'Observado', sc:'badge-error', date:'05 Jul 2024' },
    { exp:'EXP-2024-0201', title:'Reserva de Matrícula', status:'En cola', sc:'badge-neutral', date:'10 Jun 2024' },
  ];

  const completadas = [
    { exp:'EXP-2023-8841', title:'Carné Universitario', status:'Aprobado', sc:'badge-success', date:'14 Dic 2023' },
    { exp:'EXP-2023-7720', title:'Constancia de Notas', status:'Aprobado', sc:'badge-success', date:'05 Nov 2023' },
    { exp:'EXP-2023-6601', title:'Duplicado de Carné', status:'Aprobado', sc:'badge-success', date:'22 Sep 2023' },
  ];

  function renderRows(items) {
    return `
      <div style="${rowStyle};background:var(--clr-surface-container-low);font-size:12px;font-weight:700;color:var(--clr-secondary);text-transform:uppercase;letter-spacing:.06em;cursor:default">
        <div>Trámite</div><div>Estado</div><div>Fecha</div>
      </div>
      ${items.map(i => `
        <div style="${rowStyle}" onclick="navigate('seguimiento.detalle')" onmouseover="this.style.background='var(--clr-surface-container-low)'" onmouseout="this.style.background=''">
          <div>
            <div style="font-size:14px;font-weight:600;color:var(--clr-on-surface)">${i.title}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--clr-secondary)">${i.exp}</div>
          </div>
          <div><span class="badge ${i.sc}">${i.status}</span></div>
          <div style="font-size:13px;color:var(--clr-secondary)">${i.date}</div>
        </div>
      `).join('')}
    `;
  }

  document.getElementById('enviadas-list').innerHTML = renderRows(enviadas);
  document.getElementById('completadas-list').innerHTML = renderRows(completadas);

  initPage({ route: 'estudiante.solicitudes', pageTitle: 'Mis Solicitudes' });
  initTabs('req-tabs');
</script>
</body>
</html>
